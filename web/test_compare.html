<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>对比测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a1628; overflow: hidden; }
        .screen { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
        .screen.active { display: flex; }
        #game-canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="main-menu" class="screen active">
        <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">
            <button id="btn-start" style="padding:20px 40px;font-size:1.5rem">开始游戏</button>
        </div>
    </div>
    <div id="game-screen" class="screen">
        <canvas id="game-canvas"></canvas>
    </div>

    <script src="js/config.js"></script>
    <script src="js/player.js"></script>
    <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const btnStart = document.getElementById('btn-start');
    const mainMenu = document.getElementById('main-menu');
    const gameScreen = document.getElementById('game-screen');

    let player = null;
    let camera = { x: 0, y: 0 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        console.log('Canvas resized:', canvas.width, 'x', canvas.height);
    }

    function startGame() {
        resize();
        mainMenu.classList.remove('active');
        gameScreen.classList.add('active');
        
        player = new Player(canvas.width/2, canvas.height/2);
        console.log('Player created:', player.x, player.y);
        
        camera.x = player.x - canvas.width/2;
        camera.y = player.y - canvas.height/2;
        
        render();
    }

    function render() {
        if (!player) return;
        
        ctx.fillStyle = '#0a1628';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(-camera.x, -camera.y);
        player.render(ctx);
        ctx.restore();
        
        requestAnimationFrame(render);
    }

    window.addEventListener('resize', resize);
    btnStart.addEventListener('click', startGame);
    resize();

    console.log('Page loaded');
    </script>
</body>
</html>
