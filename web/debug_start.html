<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>调试开始</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a1628; overflow: hidden; }
        .screen { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
        .screen.active { display: flex; }
        #game-canvas { width: 100%; height: 100%; }
        #debug { position: fixed; top: 60px; left: 10px; color: #0f0; font: 12px monospace; background: rgba(0,0,0,0.8); padding: 10px; z-index: 9999; }
    </style>
</head>
<body>
    <div id="main-menu" class="screen active">
        <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">
            <button id="btn-start" style="padding:20px 40px;font-size:1.5rem">开始游戏</button>
        </div>
    </div>
    <div id="game-screen" class="screen">
        <canvas id="game-canvas"></canvas>
    </div>
    <div id="debug"></div>

    <script src="js/config.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/evolution.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
    <script>
    const debug = document.getElementById('debug');
    function log(msg) {
        debug.innerHTML += msg + '<br>';
        console.log(msg);
    }
    
    log('Checking Game...');
    log('Game: ' + typeof Game);
    
    if (typeof Game !== 'undefined') {
        log('Creating game instance...');
        try {
            const game = new Game();
            log('Game created successfully');
            log('Canvas: ' + game.canvas.width + 'x' + game.canvas.height);
            
            const btn = document.getElementById('btn-start');
            btn.onclick = function() {
                log('Button clicked');
                try {
                    game.startGame();
                    log('startGame completed, state: ' + game.state);
                } catch(e) {
                    log('startGame error: ' + e.message);
                }
            };
        } catch(e) {
            log('Game constructor error: ' + e.message);
            log(e.stack);
        }
    } else {
        log('Game not found!');
    }
    </script>
</body>
</html>
