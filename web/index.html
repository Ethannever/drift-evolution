<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌊 漂流进化 - Drift Evolution</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', 'Microsoft YaHei', sans-serif;
        }
        .menu-container h1 {
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>
    <!-- 主菜单 -->
    <div id="main-menu" class="screen active">
        <div class="menu-container">
            <h1>🌊 漂流进化</h1>
            <p class="subtitle">DRIFT EVOLUTION - RUINED WORLD</p>
            <div class="menu-buttons">
                <button id="btn-start" class="menu-btn">🎮 开始冒险</button>
                <button id="btn-continue" class="menu-btn" disabled>📂 继续游戏</button>
            </div>
            <p class="version">v3.3.1 | 多人模式</p>
        </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-screen" class="screen">
        <canvas id="game-canvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <!-- 多人模式状态 -->
            <div id="mp-status"></div>

            <div class="hud-top">
                <div class="hud-item">
                    <span class="label">❤️ HP</span>
                    <div class="hp-bar">
                        <div id="hp-fill" class="fill"></div>
                    </div>
                    <span id="hp-text" class="value">50/50</span>
                </div>
                <div class="hud-item">
                    <span class="label">📦 货物</span>
                    <span id="cargo-text" class="value">0/5</span>
                </div>
                <div class="hud-item">
                    <span class="label">🚢 阶段</span>
                    <span id="stage-text" class="value">木筏</span>
                </div>
                <div class="hud-item">
                    <span class="label">⚔️ 武器</span>
                    <span id="weapon-name" class="value">无</span>
                    <span id="weapon-ammo" class="value"></span>
                </div>
                <div class="hud-item">
                    <span class="label">🚀 速度</span>
                    <span id="speed-text" class="value">0</span>
                </div>
            </div>
            
            <div class="hud-left">
                <div class="panel">
                    <h3>📦 物资</h3>
                    <div id="inventory-list"></div>
                </div>
            </div>
            
            <div class="hud-right">
                <div class="panel">
                    <h3>🔧 科技</h3>
                    <span id="tech-points" class="value">0</span>
                </div>
            </div>
        </div>
        
        <!-- 虚拟摇杆 -->
        <div id="joystick-area">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>
        
        <!-- 射击按钮 -->
        <button id="fire-button">🔥<br>FIRE</button>
        
        <!-- 快捷按钮 -->
        <div id="quick-buttons">
            <button class="quick-btn" id="btn-evolution">🚀<br>进化</button>
            <button class="quick-btn" id="btn-tech-tree">🌳<br>科技</button>
            <button class="quick-btn" id="btn-quest">📋<br>任务</button>
            <button class="quick-btn" id="btn-bug">🐛<br>Bug</button>
            <button class="quick-btn" id="btn-ai">🤖<br>AI</button>
            <button class="quick-btn" id="btn-sound">🔊</button>
        </div>
        
        <!-- 进化面板 -->
        <div id="evolution-panel" class="panel popup hidden">
            <div class="panel-header">
                <h3>🚀 进化</h3>
                <button id="btn-close-evolution" class="close-btn">×</button>
            </div>
            <div id="evolution-options"></div>
        </div>
        
        <!-- 科技树面板 -->
        <div id="tech-tree-panel" class="panel popup hidden">
            <div class="panel-header">
                <h3>🌳 科技树</h3>
                <button id="btn-close-tech-tree" class="close-btn">×</button>
            </div>
            <div id="tech-tree-content"></div>
        </div>
        
        <!-- Bug报告面板 -->
        <div id="bug-panel" class="panel popup hidden">
            <div class="panel-header">
                <h3>🐛 Bug猎人</h3>
                <button id="btn-close-bug" class="close-btn">×</button>
            </div>
            <div id="bug-content">
                <p>🏆 科技点: <span id="bug-points">0</span></p>
                <textarea id="bug-input" placeholder="描述你发现的问题..."></textarea>
                <button id="btn-report-bug" class="action-btn">🐛 报告Bug (+50科技点)</button>
            </div>
        </div>
        
        <!-- AI 管理面板 / 船载Agent面板 -->
        <div id="ai-panel" class="panel popup hidden">
            <div class="panel-header">
                <h3>🤖 <span id="companion-name-display">小舵</span> <span id="companion-mood" style="font-size:0.85rem;">😐</span></h3>
                <button id="btn-close-ai" class="close-btn">×</button>
            </div>
            <div id="ai-content">
                <!-- Agent 状态栏 -->
                <div id="ai-status" style="margin-bottom:10px;font-size:0.85rem;color:#8ab4d4;"></div>
                <!-- 聊天记录 -->
                <div id="companion-chat-log" style="max-height:220px;overflow-y:auto;font-size:0.8rem;background:rgba(0,0,0,0.3);border-radius:8px;padding:8px;margin-bottom:8px;"></div>
                <!-- 聊天输入 -->
                <div style="display:flex;gap:6px;margin-bottom:10px;">
                    <input id="companion-chat-input" type="text" placeholder="和小舵聊天..." style="flex:1;padding:6px 10px;border-radius:6px;border:1px solid rgba(79,195,247,0.3);background:rgba(0,20,40,0.8);color:#e0e0e0;font-size:0.85rem;outline:none;">
                    <button id="companion-chat-send" class="action-btn" style="padding:6px 12px;white-space:nowrap;">发送</button>
                </div>
                <!-- 模式切换 & 功能按钮 -->
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
                    <button class="action-btn" id="btn-ai-advisor" style="flex:1;font-size:0.8rem;">💡 建议</button>
                    <button class="action-btn" id="btn-ai-evolve" style="flex:1;font-size:0.8rem;">🧬 生成</button>
                    <button class="action-btn" id="btn-ai-status" style="flex:1;font-size:0.8rem;">📊 分析</button>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button class="action-btn btn-mode active" data-mode="balanced" style="flex:1;font-size:0.75rem;">⚖️平衡</button>
                    <button class="action-btn btn-mode" data-mode="explore" style="flex:1;font-size:0.75rem;">🔭探索</button>
                    <button class="action-btn btn-mode" data-mode="combat" style="flex:1;font-size:0.75rem;">⚔️战斗</button>
                    <button class="action-btn btn-mode" data-mode="collect" style="flex:1;font-size:0.75rem;">📦收集</button>
                </div>
                <!-- Agent 性格 & 技能（折叠） -->
                <details style="margin-top:8px;">
                    <summary style="font-size:0.8rem;color:#8ab4d4;cursor:pointer;">🧠 性格 & 技能详情</summary>
                    <div id="companion-details" style="font-size:0.75rem;color:#aaa;margin-top:6px;"></div>
                </details>
            </div>
        </div>

        <!-- 任务面板 -->
        <div id="quest-panel" class="panel popup hidden">
            <div class="panel-header">
                <h3>📋 任务</h3>
                <button id="btn-close-quest" class="close-btn">×</button>
            </div>
            <div id="quest-content"></div>
        </div>
        
        <!-- 道具/背包按钮 -->
        <button class="quick-btn" id="btn-inventory">🎒<br>背包</button>

        <!-- 技能按钮 -->
        <button class="quick-btn" id="btn-skills">⚡<br>技能</button>

        <!-- 小地图 -->
        <div id="minimap">
            <canvas id="minimap-canvas" width="100" height="100"></canvas>
        </div>

        <!-- 道具面板 -->
        <div id="inventory-panel" class="panel popup hidden">
            <div class="panel-header">
                <h3>🎒 背包</h3>
                <button id="btn-close-inventory" class="close-btn">×</button>
            </div>
            <div id="inventory-grid"></div>
        </div>

        <!-- 技能面板 -->
        <div id="skills-panel" class="panel popup hidden">
            <div class="panel-header">
                <h3>⚡ 技能</h3>
                <button id="btn-close-skills" class="close-btn">×</button>
            </div>
            <div id="skills-list"></div>
        </div>

        <!-- 游戏结束 -->
        <div id="game-over" class="hidden">
            <div class="overlay">
                <h2>💀 游戏结束</h2>
                <p>载具已被摧毁</p>
                <button id="btn-restart" class="menu-btn">🔄 重新开始</button>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=2.1.0"></script>
    <script src="js/sprites.js?v=3.0.0"></script>
    <script src="js/ai.js?v=2.1.0"></script>
    <script src="js/player.js?v=3.0.0"></script>
    <script src="js/enemy.js?v=2.1.0"></script>
    <script src="js/combat.js?v=2.1.0"></script>
    <script src="js/evolution.js?v=2.1.0"></script>
    <script src="js/skills.js?v=2.1.0"></script>
    <script src="js/sound.js?v=2.1.0"></script>
    <script src="js/particles.js?v=2.1.0"></script>
    <script src="js/quests.js?v=2.1.0"></script>
    <script src="js/multiplayer.js?v=3.3.1"></script>
    <script src="js/companion.js?v=3.4.0"></script>
    <script src="js/agent-hub.js?v=4.0.0"></script>
    <script src="js/game.js?v=2.1.0"></script>
</body>
</html>
